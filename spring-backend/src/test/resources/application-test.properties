spring.application.name=proyec_herramientas

# Base exclusiva de pruebas: se crea sola si no existe (MySQL Connector/J).
# NUNCA apuntar aqui a la base de desarrollo, este script borra y recrea tablas.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_TEST_NAME:proyecto_test}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/esquema-pruebas.sql
spring.sql.init.data-locations=classpath:db/datos-pruebas.sql

# Solo para pruebas: si no se exporta JWT_SECRET, usa este valor fijo para
# que ./mvnw test no requiera configurar nada mas.
jwt.secret=${JWT_SECRET:solo-para-pruebas-nunca-usar-en-produccion}
