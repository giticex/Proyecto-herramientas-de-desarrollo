spring.application.name=proyec_herramientas

# El esquema lo crea database/script_mysql.sql, no Hibernate.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:proyecto}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Roles y seguridad (SCRUM-6) ---
# Secreto para firmar los tokens de sesion. En produccion llega por variable
# de entorno: APP_TOKEN_SECRETO.
app.token.secreto=${APP_TOKEN_SECRETO:secreto-de-desarrollo-cambiar-en-produccion}
app.token.expiracion-minutos=${APP_TOKEN_EXPIRACION_MINUTOS:120}
# Orígenes desde los que se puede llamar a la API (frontend React en 5173).
app.cors.origins=${APP_CORS_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:4173}
