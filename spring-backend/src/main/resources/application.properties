spring.application.name=proyec_herramientas

# El esquema lo crea database/script_mysql.sql, no Hibernate.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:proyecto}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Secreto para firmar los JWT (HS256). Nunca lo escribas aqui: siempre viene
# de la variable de entorno JWT_SECRET (ver docker-compose.yml y .env.example).
jwt.secret=${JWT_SECRET}
