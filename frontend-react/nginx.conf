server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router maneja las rutas del lado del cliente: cualquier ruta
    # que no sea un archivo real debe devolver index.html para que la app
    # decida qué mostrar (si no, recargar en /admin/login o /tienda/<slug>
    # da 404 porque esos paths no existen como archivos en el servidor).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
