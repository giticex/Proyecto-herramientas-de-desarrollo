name: CI

on:
  push:
    branches: [main, develop, 'SCRUM-*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Spring Boot + MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spring-backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: proyecto_test
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_TEST_NAME: proyecto_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: spring-backend/pom.xml

      - name: Ejecutar pruebas
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Subir reportes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: spring-backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Subir build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-react/dist/
          retention-days: 7
